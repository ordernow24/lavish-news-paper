name: Lavish News - 4 Hourly Collection

on:
  schedule:
    # Runs at 6:00, 10:00, 14:00, 18:00, 22:00 IST = 00:30,04:30,08:30,12:30,16:30 UTC
    - cron: "30 0,4,8,12,16 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" button too

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 4-hourly collection cycle
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: python scripts/run_cycle.py

      - name: Commit updated data
        run: |
          git config user.name "lavish-news-bot"
          git config user.email "bot@lavishnewspaper.local"
          git add data/
          git diff --cached --quiet || git commit -m "Auto: 4-hourly news collection [skip ci]"
          git push
