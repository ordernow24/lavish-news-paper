name: Lavish News - Midnight Publish

on:
  schedule:
    # 12:00 AM IST = 18:30 UTC (previous day)
    - cron: "30 18 * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Hindi font (Noto Sans Devanagari)
        run: |
          mkdir -p fonts
          curl -L -o fonts/NotoSansDevanagari-Regular.ttf "https://raw.githubusercontent.com/openmaptiles/fonts/master/noto-sans/NotoSansDevanagari-Regular.ttf" || echo "Font download failed - English PDF will still be generated"
          curl -L -o fonts/NotoSansDevanagari-Bold.ttf "https://raw.githubusercontent.com/openmaptiles/fonts/master/noto-sans/NotoSansDevanagari-Bold.ttf" || echo "Bold font download failed - will reuse regular weight"

      - name: Run midnight publish (PDF + Telegram)
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_publish.py

      - name: Upload PDFs as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: lavish-news-pdfs-${{ github.run_id }}
          path: output/*.pdf
          retention-days: 14

      - name: Commit archive + reset data
        run: |
          git config user.name "lavish-news-bot"
          git config user.email "bot@lavishnewspaper.local"
          git add data/
          git diff --cached --quiet || git commit -m "Auto: archive + reset after publish [skip ci]"
          git push
